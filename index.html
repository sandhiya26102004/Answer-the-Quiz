<!DOCTYPE html>
<html>
<head>
  <title>Answer the Question</title>
</head>
<body>

  <h1>Answer the Question</h1>

  <form id="questionsForm">
    <p><strong>What is the capital of India?</strong></p>

    <input type="radio" id="cityHyderabad" name="capital" value="Hyderabad">
    <label for="cityHyderabad">Hyderabad</label><br>

    <input type="radio" id="cityChennai" name="capital" value="Chennai">
    <label for="cityChennai">Chennai</label><br>

    <input type="radio" id="cityDelhi" name="capital" value="Delhi">
    <label for="cityDelhi">Delhi</label><br>

    <input type="radio" id="cityMumbai" name="capital" value="Mumbai">
    <label for="cityMumbai">Mumbai</label><br><br>

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <p id="resultMsg"></p>

  <script src="script.js"></script>

</body>
</html>
